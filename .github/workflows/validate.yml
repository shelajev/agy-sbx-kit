name: Validate Kits v3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install kit-tck
        run: go install github.com/docker/sandbox-kit-spec/v3/cmd/kit-tck@v3.0.0-m.6

      - name: Build workload OCI artifact
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' agy.yaml)
          docker buildx build . -f agy.yaml -t "agy-sbx-kit:$version" \
            --output type=oci,dest=/tmp/agy-layout,tar=false

      - name: Validate workload conformance
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' agy.yaml)
          kit-tck validate --layout /tmp/agy-layout "$version"

      - name: Build mixin OCI artifact
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' agy-mixin/agy-mixin.yaml)
          docker buildx build agy-mixin -f agy-mixin/agy-mixin.yaml \
            -t "agy-sbx-kit-mixin:$version" \
            --output type=oci,dest=/tmp/agy-mixin-layout,tar=false

      - name: Validate mixin conformance
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' agy-mixin/agy-mixin.yaml)
          kit-tck validate --layout /tmp/agy-mixin-layout "$version"

      - name: Check wrapper syntax
        run: bash -n run.sh
